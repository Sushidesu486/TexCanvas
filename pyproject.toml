[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "texcanvas"
version = "0.5.0"
description = "Generate editable Beamer-style academic PPTX decks from YAML"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "texcanvas contributors"}]
dependencies = [
  "python-pptx>=1.0",
  "PyYAML>=6.0",
  "Pillow>=10.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]
math = []  # native equation rendering uses an external `pandoc` binary; see README

[project.scripts]
texcanvas = "texcanvas.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
texcanvas = ["templates/*.pptx"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
